# M5Stack Chain DualKey (ESP32-S3) as a reef-tank controller + status light.
#
# Flash with the ESPHome dashboard / CLI (USB-C). Pin map (from M5's HA docs):
#   KEY1 = GPIO0, KEY2 = GPIO17, 2x WS2812 = GPIO21, PWR_EN = GPIO40,
#   battery ADC = GPIO10. Keep it on USB power for an always-on controller
#   (the 350 mAh battery is for portability; Wi-Fi drains it in hours).
#
# It exposes to Home Assistant:
#   - binary_sensor.key_1 / key_2 (raw), plus fired events for single/long press
#     and "both held" (esphome.reef_key1_single, _key1_long, _key2_single,
#     _key2_long, _both_long) — use these as automation triggers.
#   - light.status_leds (both LEDs, with Pulse / Strobe / Alternate effects for
#     alarms) and light.key_1_led / light.key_2_led (individual).
#   - sensor.battery_voltage.
# Put the mode logic (feeding, maintenance) and the alarm->LED rules in HA.
#
# NOTE: GPIO0 is a boot-strap pin — don't hold KEY1 while powering on / flashing.

esphome:
  name: reef-dualkey
  friendly_name: Reef DualKey
  on_boot:
    priority: 600
    then:
      - output.turn_on: pwr_en   # latch power on

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
api:                 # native Home Assistant API (auto-discovered)
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}             # fallback hotspot for first setup

captive_portal:

output:
  - platform: gpio
    pin: GPIO40
    id: pwr_en

light:
  - platform: esp32_rmt_led_strip
    id: status_strip
    name: "Status LEDs"
    pin: GPIO21
    num_leds: 2
    rgb_order: GRB
    chipset: WS2812
    default_transition_length: 150ms
    effects:
      - pulse:
          name: "Pulse"
          transition_length: 400ms
          update_interval: 500ms
      - strobe:
          name: "Blink"
      - addressable_lambda:
          name: "Alternate"
          update_interval: 350ms
          lambda: |-
            static int t = 0;
            t++;
            bool phase = (t % 2) == 0;
            it[0] = phase ? current_color : Color::BLACK;
            it[1] = phase ? Color::BLACK : current_color;
  - platform: partition
    name: "Key 1 LED"
    id: key_1_led
    segments:
      - { id: status_strip, from: 0, to: 0 }
  - platform: partition
    name: "Key 2 LED"
    id: key_2_led
    segments:
      - { id: status_strip, from: 1, to: 1 }

binary_sensor:
  - platform: gpio
    name: "Key 1"
    id: key1
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_multi_click:
      - timing:
          - ON for at most 0.9s
          - OFF for at least 0.25s
        then:
          - homeassistant.event:
              event: esphome.reef_key1_single
      - timing:
          - ON for at least 0.9s
        then:
          - homeassistant.event:
              event: esphome.reef_key1_long

  - platform: gpio
    name: "Key 2"
    id: key2
    pin:
      number: GPIO17
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_multi_click:
      - timing:
          - ON for at most 0.9s
          - OFF for at least 0.25s
        then:
          - homeassistant.event:
              event: esphome.reef_key2_single
      - timing:
          - ON for at least 0.9s
        then:
          - homeassistant.event:
              event: esphome.reef_key2_long

  # Both keys held together -> maintenance mode
  - platform: template
    name: "Both keys held"
    id: both_keys
    lambda: "return id(key1).state && id(key2).state;"
    on_press:
      then:
        - delay: 1.5s
        - if:
            condition:
              lambda: "return id(key1).state && id(key2).state;"
            then:
              - homeassistant.event:
                  event: esphome.reef_both_long

sensor:
  - platform: adc
    pin: GPIO10
    name: "Battery voltage"
    attenuation: 12db
    update_interval: 60s
    filters:
      # The board has a voltage divider; adjust the multiplier to match a known
      # reading (commonly ~2x).
      - multiply: 2.0
