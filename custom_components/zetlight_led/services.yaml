set_schedule:
  name: Set daily schedule
  description: >-
    Write the device's daily lighting schedule (5 time slots x 4 channels).
    WARNING: this overwrites the light's stored time-curve program.
  fields:
    entry_ids:
      name: Target config entry IDs
      description: Optional for one loaded light; required when multiple lights are loaded. Only explicitly selected lights are changed.
      selector:
        object:
    start:
      name: Start time
      description: Start time of the first slot, as HH:MM (24h).
      required: true
      example: "07:30"
      selector:
        text:
    durations:
      name: Slot durations (minutes)
      description: Length in minutes of each of the 5 slots (must sum to <= 1440).
      required: true
      example: "[60, 120, 480, 120, 120]"
      selector:
        object:
    brightness:
      name: Per-slot brightness
      description: >-
        Five slots, each four channel values in the verified model range (marine M5 0-200).
        A white, B UV violet, C royal blue, D ice blue on the tested M5.
      required: true
      example: "[[2,18,18,2],[4,36,24,4],[10,90,60,10],[6,54,36,6],[3,27,18,3]]"
      selector:
        object:

sync_clock:
  name: Sync clock
  description: Set the device clock to Home Assistant's current local time.

adopt_current_schedule:
  name: Accept current lamp program as baseline
  description: >-
    Read the current lamp curve and explicitly accept it as the new100% baseline.
    Keeps a revision of the prior HA baseline; sends no lamp write or mode command.
    Does not import or change the phone App's preset library. Refuses pending recovery.
  fields:
    entry_ids:
      name: Target config entry IDs
      selector:
        object:
    confirm_current:
      name: Confirm current program is the intended baseline
      required: true
      selector:
        boolean:
