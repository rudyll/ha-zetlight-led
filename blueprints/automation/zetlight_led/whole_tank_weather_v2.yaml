blueprint:
  name: 整缸联动 — 天气（灯光与造浪独立）v2 / Whole-tank weather v2
  description: |-
    本地增益修正候选，尚未发布／部署。灯光和造浪分别配置七档天气；晴天造浪100保留既有日常曲线，雨天110、大风115、暴雨120、雷暴130为待核定示例。
    造浪只从保存的日常基线计算，100恢复原曲线；设备端各时段仍受原始功率上限约束，削顶时不能保证比例或实际流量同比变化。
    依赖同批未发布GTS增益候选（上限200%）；旧版上限100时，超出实体能力的泵写入跳过，灯光分支独立执行。不能仅更改蓝图数字就宣称增益已生效。
    喂食、维护、恢复及缺测时不写入。灯须已开且按日程运行；泵须已开、tide且非喂食。天气不明保持现状，不开泵、开灯或强切模式。
    原固定百分比手动风暴与相对基线增益尚未统一，现有风暴草稿不得视为已经符合该修正规则；启用前需一起核定。
    替换旧天气／驯化控制者，不能同时占用同一比例实体。示例值不是任何缸的实测安全配置。停用不会自动还原比例。

    Local candidate:100% preserves the tuned daily tidal baseline, above100 adds bounded weather gain. Requires the matching unreleased GTS gain implementation.
    Targets above the live entity maximum are skipped. Existing HA drafts are not changed by this source edit.
  domain: automation
  input:
    weather_entity:
      name: 天气来源 / Weather
      selector:
        entity:
          filter:
          - domain: weather
    light_entity:
      name: 珊瑚灯 / Coral light
      selector:
        entity:
          filter:
          - domain: light
            integration: zetlight_led
      description: 只在灯已开启且按日程运行时调整；不会开灯。
    light_dimming:
      name: 灯光调光比例 / Light dimming
      selector:
        entity:
          filter:
          - domain: number
            integration: zetlight_led
      description: 选择调光比例，不是单通道亮度；不可与驯化或另一条天气自动化共用。
    pump_fan:
      name: 造浪泵 / Wave pump
      selector:
        entity:
          filter:
          - domain: fan
            integration: gts_wavepump
      description: 只在泵已经开启时调整；不会启动泵。
    pump_tidal:
      name: 造浪潮汐增益 / Tidal gain
      selector:
        entity:
          filter:
          - domain: number
            integration: gts_wavepump
      description: 100%是日常曲线，110%从日常基线增加10%。需要支持200%范围的GTS增益候选；旧版仍最多100%。
    pump_run_mode:
      name: 造浪运行模式 / Pump run mode
      selector:
        entity:
          filter:
          - domain: select
            integration: gts_wavepump
      description: 选择运行模式；只有 tide 时写入，不抢占手动风暴。
    pump_flow_mode:
      name: 造浪实际流态 / Pump flow mode
      selector:
        entity:
          filter:
          - domain: sensor
            integration: gts_wavepump
      description: 选择实际流态；喂食、停止或缺测时不写入。
    feeding_switch:
      name: 喂食模式开关 / Feeding switch
      selector:
        entity:
          filter:
          - domain: switch
    maintenance_toggle:
      name: 维护模式开关 / Maintenance toggle
      selector:
        entity:
          filter:
          - domain: input_boolean
    maintenance_restore_marker:
      name: 维护灯光恢复标记 / Maintenance restore marker
      selector:
        entity:
          filter:
          - domain: input_boolean
      description: 选择整缸喂食维护v2使用的恢复标记；恢复尚未结束时不调节。
    light_sunny_pct:
      name: 灯光 · 晴天／晴夜 / light sunny
      default: 100
      selector:
        number:
          min: 10
          max: 100
          step: 1
          unit_of_measurement: '%'
    light_partly_pct:
      name: 灯光 · 多云 / light partly
      default: 90
      selector:
        number:
          min: 10
          max: 100
          step: 1
          unit_of_measurement: '%'
    light_cloudy_pct:
      name: 灯光 · 阴天／雾 / light cloudy
      default: 75
      selector:
        number:
          min: 10
          max: 100
          step: 1
          unit_of_measurement: '%'
    light_rainy_pct:
      name: 灯光 · 雨／雪 / light rainy
      default: 60
      selector:
        number:
          min: 10
          max: 100
          step: 1
          unit_of_measurement: '%'
    light_windy_pct:
      name: 灯光 · 大风 / light windy
      default: 75
      selector:
        number:
          min: 10
          max: 100
          step: 1
          unit_of_measurement: '%'
    light_pouring_pct:
      name: 灯光 · 暴雨／冰雹 / light pouring
      default: 50
      selector:
        number:
          min: 10
          max: 100
          step: 1
          unit_of_measurement: '%'
    light_storm_pct:
      name: 灯光 · 雷暴 / light storm
      default: 50
      selector:
        number:
          min: 10
          max: 100
          step: 1
          unit_of_measurement: '%'
    pump_sunny_pct:
      name: 造浪 · 晴天／晴夜 / pump sunny
      default: 100
      selector:
        number:
          min: 10
          max: 200
          step: 5
          unit_of_measurement: '%'
    pump_partly_pct:
      name: 造浪 · 多云 / pump partly
      default: 100
      selector:
        number:
          min: 10
          max: 200
          step: 5
          unit_of_measurement: '%'
    pump_cloudy_pct:
      name: 造浪 · 阴天／雾 / pump cloudy
      default: 100
      selector:
        number:
          min: 10
          max: 200
          step: 5
          unit_of_measurement: '%'
    pump_rainy_pct:
      name: 造浪 · 雨／雪 / pump rainy
      default: 110
      selector:
        number:
          min: 10
          max: 200
          step: 5
          unit_of_measurement: '%'
    pump_windy_pct:
      name: 造浪 · 大风 / pump windy
      default: 115
      selector:
        number:
          min: 10
          max: 200
          step: 5
          unit_of_measurement: '%'
    pump_pouring_pct:
      name: 造浪 · 暴雨／冰雹 / pump pouring
      default: 120
      selector:
        number:
          min: 10
          max: 200
          step: 5
          unit_of_measurement: '%'
    pump_storm_pct:
      name: 造浪 · 雷暴 / pump storm
      default: 130
      selector:
        number:
          min: 10
          max: 200
          step: 5
          unit_of_measurement: '%'
    pump_ceiling:
      name: 造浪天气增益上限 / Tidal gain ceiling
      description: 限制天气增益倍率，不改变设备原始功率上限；手动风暴不受此比例限制。
      default: 130
      selector:
        number:
          min: 10
          max: 200
          step: 5
          unit_of_measurement: '%'
mode: restart
variables:
  weather_entity: !input 'weather_entity'
  light_entity: !input 'light_entity'
  light_dimming: !input 'light_dimming'
  pump_fan: !input 'pump_fan'
  pump_tidal: !input 'pump_tidal'
  pump_run_mode: !input 'pump_run_mode'
  pump_flow_mode: !input 'pump_flow_mode'
  feeding_switch: !input 'feeding_switch'
  maintenance_toggle: !input 'maintenance_toggle'
  maintenance_restore_marker: !input 'maintenance_restore_marker'
  pump_ceiling: !input 'pump_ceiling'
  light_levels:
    sunny: !input 'light_sunny_pct'
    partly: !input 'light_partly_pct'
    cloudy: !input 'light_cloudy_pct'
    rainy: !input 'light_rainy_pct'
    windy: !input 'light_windy_pct'
    pouring: !input 'light_pouring_pct'
    storm: !input 'light_storm_pct'
  pump_levels:
    sunny: !input 'pump_sunny_pct'
    partly: !input 'pump_partly_pct'
    cloudy: !input 'pump_cloudy_pct'
    rainy: !input 'pump_rainy_pct'
    windy: !input 'pump_windy_pct'
    pouring: !input 'pump_pouring_pct'
    storm: !input 'pump_storm_pct'
  weather_groups:
    sunny: sunny
    clear-night: sunny
    partlycloudy: partly
    cloudy: cloudy
    fog: cloudy
    rainy: rainy
    snowy: rainy
    snowy-rainy: rainy
    windy: windy
    windy-variant: windy
    pouring: pouring
    hail: pouring
    lightning: storm
    lightning-rainy: storm
trigger:
- platform: state
  entity_id:
  - !input 'weather_entity'
  - !input 'light_entity'
  - !input 'pump_fan'
  - !input 'pump_run_mode'
  - !input 'pump_flow_mode'
  - !input 'feeding_switch'
  - !input 'maintenance_toggle'
  - !input 'maintenance_restore_marker'
- platform: homeassistant
  event: start
- platform: state
  entity_id: !input 'light_dimming'
  from: unknown
- platform: state
  entity_id: !input 'light_dimming'
  from: unavailable
- platform: state
  entity_id: !input 'pump_tidal'
  from: unknown
- platform: state
  entity_id: !input 'pump_tidal'
  from: unavailable
action:
- variables:
    weather_sample: '{{ states(weather_entity) }}'
- variables:
    bucket: '{{ weather_groups.get(weather_sample, ''unknown'') }}'
- condition: template
  value_template: |-
    {{ is_state(feeding_switch, 'off') and is_state(maintenance_toggle, 'off') and is_state(maintenance_restore_marker, 'off') and bucket in light_levels }}
- variables:
    light_target: '{% set v = light_levels.get(bucket) %}{{ ([[v | float, 10] | max, 100] | min) | int if is_number(v)
      else -1 }}'
    pump_target: |-
      {% set v = pump_levels.get(bucket) %}{% if is_number(v) and is_number(pump_ceiling) %}{% set capped = [[v | float, pump_ceiling | float, 200] | min, 10] | max %}{{ ((capped / 5) | round(0, 'floor') * 5) | int }}{% else %}-1{% endif %}
- if: |-
    {{ is_state(feeding_switch, 'off') and is_state(maintenance_toggle, 'off') and is_state(maintenance_restore_marker, 'off') and states(weather_entity) == weather_sample and bucket in light_levels and is_state(light_entity, 'on') and state_attr(light_entity, 'active_mode') == 'schedule' and state_attr(light_entity, 'schedule_recovery_required') != true and is_number(states(light_dimming)) and light_target | float >= 10 and (states(light_dimming) | float - light_target | float) | abs > 0.01 }}
  then:
  - service: number.set_value
    continue_on_error: true
    target:
      entity_id: !input 'light_dimming'
    data:
      value: '{{ light_target | int }}'
- if: |-
    {{ is_state(feeding_switch, 'off') and is_state(maintenance_toggle, 'off') and is_state(maintenance_restore_marker, 'off') and states(weather_entity) == weather_sample and bucket in light_levels and is_number(pump_ceiling) and 10 <= pump_ceiling | float <= 200 and is_state(pump_fan, 'on') and is_state(pump_run_mode, 'tide') and states(pump_flow_mode) in ['constant', 'pulse', 'sine', 'turbulence', 'surge'] and state_attr(light_entity, 'active_mode') != 'feeding' and state_attr(pump_tidal, 'recovery_required') != true and is_number(states(pump_tidal)) and is_number(state_attr(pump_tidal, 'max')) and pump_target | float <= state_attr(pump_tidal, 'max') | float and pump_target | float >= 10 and (states(pump_tidal) | float - pump_target | float) | abs > 0.01 }}
  then:
  - service: number.set_value
    continue_on_error: true
    target:
      entity_id: !input 'pump_tidal'
    data:
      value: '{{ pump_target | int }}'
