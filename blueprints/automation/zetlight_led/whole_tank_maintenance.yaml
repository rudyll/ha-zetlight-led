blueprint:
  name: 积光整缸 — 维护模式 / Maintenance mode
  description: >-
    换水/清缸时打开一个辅助开关：停泵 + 灯全白（方便看清）。关掉则恢复：泵开 +
    灯回到存储日程。请先创建一个 input_boolean（辅助元素）再在下面选它。
    （GTS 泵控制是 fan 实体。）

    Toggle on for water changes: pump stops, light goes full white. Off restores
    both.
  domain: automation
  input:
    toggle:
      name: 维护开关（input_boolean 辅助元素） / Maintenance toggle
      selector:
        entity:
          filter:
            - domain: input_boolean
    light_entity:
      name: 灯 / Light
      selector:
        entity:
          filter:
            - integration: zetlight_led
              domain: light
    pump_fan:
      name: 造浪泵（fan 实体） / Wave pump (fan)
      selector:
        entity:
          filter:
            - domain: fan

mode: queued

trigger:
  - platform: state
    entity_id: !input toggle
    to: "on"
    id: start
  - platform: state
    entity_id: !input toggle
    to: "off"
    id: end

action:
  - choose:
      - conditions: "{{ trigger.id == 'start' }}"
        sequence:
          - service: fan.turn_off
            target:
              entity_id: !input pump_fan
          - service: light.turn_on
            target:
              entity_id: !input light_entity
            data:
              brightness: 255
      - conditions: "{{ trigger.id == 'end' }}"
        sequence:
          - service: fan.turn_on
            target:
              entity_id: !input pump_fan
          - service: light.turn_on
            target:
              entity_id: !input light_entity
