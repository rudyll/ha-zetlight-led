blueprint:
  name: Zetlight whole-tank — maintenance mode
  description: >-
    Flip a helper toggle on for water changes / cleaning: the wave pump stops and
    the light goes full white for visibility. Flip it off to restore: pump on and
    the light resumes its stored program. Create an input_boolean (helper) first
    and select it below. (GTS pump control is a fan entity.)
  domain: automation
  input:
    toggle:
      name: Maintenance toggle (input_boolean helper)
      selector:
        entity:
          filter:
            - domain: input_boolean
    light_entity:
      name: Light
      selector:
        entity:
          filter:
            - integration: zetlight_led
              domain: light
    pump_fan:
      name: Wave pump (fan)
      selector:
        entity:
          filter:
            - domain: fan

mode: queued

trigger:
  - platform: state
    entity_id: !input toggle
    to: "on"
    id: start
  - platform: state
    entity_id: !input toggle
    to: "off"
    id: end

action:
  - choose:
      - conditions: "{{ trigger.id == 'start' }}"
        sequence:
          - service: fan.turn_off
            target:
              entity_id: !input pump_fan
          - service: light.turn_on
            target:
              entity_id: !input light_entity
            data:
              brightness: 255
      - conditions: "{{ trigger.id == 'end' }}"
        sequence:
          - service: fan.turn_on
            target:
              entity_id: !input pump_fan
          - service: light.turn_on
            target:
              entity_id: !input light_entity
