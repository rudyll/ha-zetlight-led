blueprint:
  name: 积光整缸 — 维护模式 / Maintenance mode
  description: >-
    换水/清缸时打开一个辅助开关：停泵 + 切断额外设备 + 灯各通道全亮（方便看清）。此模板没有自动倒计时，需手动关闭维护开关；关掉则
    全部恢复：泵开、额外设备上电、灯回到存储日程。请先创建一个 input_boolean（辅助
    元素）再在下面选它。造浪泵(fan)和"额外断电设备"都可留空——后者用来接回水泵、
    加热棒等插在智能插座/继电器上、只能切电源的设备。

    Toggle on for water changes: pump stops, extra devices power off, light goes
    full brightness. Off restores everything. Both the fan pump and the extra devices
    are optional.
  domain: automation
  input:
    toggle:
      name: 维护开关（input_boolean 辅助元素） / Maintenance toggle
      selector:
        entity:
          filter:
            - domain: input_boolean
    light_entity:
      name: 灯 / Light
      selector:
        entity:
          filter:
            - integration: zetlight_led
              domain: light
    pump_fan:
      name: 造浪泵（fan 实体，可留空） / Wave pump (fan, optional)
      description: 能 BLE/WiFi 控的造浪泵；没有就留空。
      default:
      selector:
        entity:
          filter:
            - domain: fan
    extra_off:
      name: 额外断电设备（可留空、可多选） / Extra devices to power off (optional, multiple)
      description: >-
        维护时一起断电、结束再上电的设备——比如插在智能插座/继电器上的回水泵、加热棒
        （换水时常要停回水泵、关加热）。可多选，导入后也能再加。
        Devices cut during maintenance and restored after — e.g. a return pump or
        heater on a smart plug. Any domain; leave empty if none.
      default: []
      selector:
        entity:
          multiple: true

mode: restart

variables:
  source_mode: !input toggle

trigger:
  - platform: homeassistant
    event: start
    id: reconcile
  - platform: state
    entity_id: !input toggle
    to: "on"
    id: start
  - platform: state
    entity_id: !input toggle
    to: "off"
    id: end

action:
  - wait_template: "{{ states(source_mode) in ['on', 'off'] }}"
    timeout: "00:02:00"
    continue_on_timeout: false
  - variables:
      pump: !input pump_fan
      extras: !input extra_off
  - choose:
      - conditions: "{{ is_state(source_mode, 'on') }}"
        sequence:
          - if: "{{ pump not in [none, '', []] }}"
            then:
              - service: fan.turn_off
                target: { entity_id: "{{ pump }}" }
          - if: "{{ extras | count > 0 }}"
            then:
              - service: homeassistant.turn_off
                target: { entity_id: "{{ extras }}" }
          - service: light.turn_on
            target:
              entity_id: !input light_entity
            data:
              brightness: 255
      - conditions: "{{ is_state(source_mode, 'off') }}"
        sequence:
          - repeat:
              for_each: "{{ extras }}"
              sequence:
                - service: homeassistant.turn_on
                  continue_on_error: true
                  target: { entity_id: "{{ repeat.item }}" }
          - if: "{{ pump not in [none, '', []] }}"
            then:
              - service: fan.turn_on
                continue_on_error: true
                target: { entity_id: "{{ pump }}" }
          - service: light.turn_on
            target:
              entity_id: !input light_entity
