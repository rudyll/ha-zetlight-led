blueprint:
  name: Zetlight whole-tank — day/night flow rhythm
  description: >-
    Set the wave pump to a stronger "day" intensity at sunrise and a gentler
    "night" intensity at sunset, so flow follows the light's rhythm. (GTS pump
    control is a fan entity. Alternatively, the pump's run_mode "tide" runs its
    own built-in 24-segment day/night curve with no automation needed.)
  domain: automation
  input:
    pump_fan:
      name: Wave pump (fan)
      selector:
        entity:
          filter:
            - domain: fan
    day_value:
      name: Day intensity
      default: 70
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    night_value:
      name: Night intensity
      default: 35
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    day_offset:
      name: Sunrise offset
      default: "00:00:00"
      selector:
        time:
    night_offset:
      name: Sunset offset
      default: "00:00:00"
      selector:
        time:

mode: single

trigger:
  - platform: sun
    event: sunrise
    offset: !input day_offset
    id: day
  - platform: sun
    event: sunset
    offset: !input night_offset
    id: night

action:
  - choose:
      - conditions: "{{ trigger.id == 'day' }}"
        sequence:
          - service: fan.set_percentage
            target:
              entity_id: !input pump_fan
            data:
              percentage: !input day_value
      - conditions: "{{ trigger.id == 'night' }}"
        sequence:
          - service: fan.set_percentage
            target:
              entity_id: !input pump_fan
            data:
              percentage: !input night_value
