blueprint:
  name: 整缸联动 — 昼夜流态 / Day-night flow
  description: >-
    日出时把造浪泵设为较强的"白天"强度，日落时设为较柔的"夜间"强度，让水流跟随灯的
    节律。（GTS 泵控制是 fan 实体。另一个选择：直接把泵的 run_mode 设为 tide，
    让泵自己跑内置的 24 段昼夜曲线，无需自动化。）

    Stronger "day" intensity at sunrise, gentler "night" intensity at sunset.
  domain: automation
  input:
    pump_fan:
      name: 造浪泵（fan 实体） / Wave pump (fan)
      selector:
        entity:
          filter:
            - domain: fan
    day_value:
      name: 白天强度 / Day intensity
      default: 70
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    night_value:
      name: 夜间强度 / Night intensity
      default: 35
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    day_offset:
      name: 日出偏移 / Sunrise offset
      default: "00:00:00"
      selector:
        time:
    night_offset:
      name: 日落偏移 / Sunset offset
      default: "00:00:00"
      selector:
        time:

mode: single

trigger:
  - platform: sun
    event: sunrise
    offset: !input day_offset
    id: day
  - platform: sun
    event: sunset
    offset: !input night_offset
    id: night

action:
  - choose:
      - conditions: "{{ trigger.id == 'day' }}"
        sequence:
          - service: fan.set_percentage
            target:
              entity_id: !input pump_fan
            data:
              percentage: !input day_value
      - conditions: "{{ trigger.id == 'night' }}"
        sequence:
          - service: fan.set_percentage
            target:
              entity_id: !input pump_fan
            data:
              percentage: !input night_value
