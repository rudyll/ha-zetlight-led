blueprint:
  name: 积光整缸 — 泵跟随喂食模式 / Pump follows feeding
  description: >-
    灯进入"喂食模式"时自动停泵，喂食结束自动恢复。借用灯内置的喂食计时器，所以只按
    一下灯的喂食开关就能喂整缸。（GTS 泵的控制是 fan 实体。）

    When the light's Feeding mode turns on, pause the wave pump; resume it when
    feeding ends.
  domain: automation
  input:
    feeding_switch:
      name: 灯喂食开关 / Light feeding switch
      selector:
        entity:
          filter:
            - integration: zetlight_led
              domain: switch
    pump_fan:
      name: 造浪泵（fan 实体） / Wave pump (fan)
      description: 喂食时停泵，喂完恢复。
      selector:
        entity:
          filter:
            - domain: fan

mode: queued

trigger:
  - platform: state
    entity_id: !input feeding_switch
    to: "on"
    id: start
  - platform: state
    entity_id: !input feeding_switch
    to: "off"
    id: end

action:
  - choose:
      - conditions: "{{ trigger.id == 'start' }}"
        sequence:
          - service: fan.turn_off
            target:
              entity_id: !input pump_fan
      - conditions: "{{ trigger.id == 'end' }}"
        sequence:
          - service: fan.turn_on
            target:
              entity_id: !input pump_fan
