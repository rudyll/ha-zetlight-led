blueprint:
  name: Zetlight whole-tank — pump follows feeding mode
  description: >-
    When the light's Feeding mode turns on, pause the wave pump; resume it when
    feeding ends. Piggybacks on the light's built-in feeding timer, so one tap on
    the Feeding switch feeds the whole tank. (GTS pump control is a fan entity.)
  domain: automation
  input:
    feeding_switch:
      name: Light feeding switch
      selector:
        entity:
          filter:
            - integration: zetlight_led
              domain: switch
    pump_fan:
      name: Wave pump (fan)
      description: Turned off while feeding, back on afterwards.
      selector:
        entity:
          filter:
            - domain: fan

mode: queued

trigger:
  - platform: state
    entity_id: !input feeding_switch
    to: "on"
    id: start
  - platform: state
    entity_id: !input feeding_switch
    to: "off"
    id: end

action:
  - choose:
      - conditions: "{{ trigger.id == 'start' }}"
        sequence:
          - service: fan.turn_off
            target:
              entity_id: !input pump_fan
      - conditions: "{{ trigger.id == 'end' }}"
        sequence:
          - service: fan.turn_on
            target:
              entity_id: !input pump_fan
