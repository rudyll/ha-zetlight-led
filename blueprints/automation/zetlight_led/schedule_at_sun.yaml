blueprint:
  name: 积光灯 — 日程跟随日出/日落 / Schedule at sunrise/sunset
  description: >-
    在日出或日落（可带偏移）时写入一套日程，起始时间 = 触发时刻，让曲线随季节的
    日出日落移动。时段分钟数和各时段亮度可自行修改。

    Write a daily schedule whose start follows sunrise/sunset. Edit the durations
    and brightness to taste.
  domain: automation
  input:
    sun_event:
      name: 太阳事件 / Sun event
      default: sunrise
      selector:
        select:
          options:
            - sunrise
            - sunset
    offset:
      name: 偏移 / Offset
      description: 相对太阳事件的偏移（如 -00:30:00 表示提前 30 分钟）。
      default: "00:00:00"
      selector:
        time:
    durations:
      name: 各时段分钟数 / Slot durations (minutes)
      description: 5 个时段的长度（分钟）。
      default: [60, 120, 480, 120, 120]
    brightness:
      name: 各时段亮度 / Per-slot brightness
      description: 5 个时段，每段 [A, B, C, D]，0-100。
      default:
        - [10, 40, 30, 10]
        - [20, 60, 45, 20]
        - [40, 90, 70, 40]
        - [20, 60, 45, 20]
        - [5, 25, 18, 5]

mode: single

trigger:
  - platform: sun
    event: !input sun_event
    offset: !input offset

action:
  - service: zetlight_led.set_schedule
    data:
      start: "{{ now().strftime('%H:%M') }}"
      durations: !input durations
      brightness: !input brightness
