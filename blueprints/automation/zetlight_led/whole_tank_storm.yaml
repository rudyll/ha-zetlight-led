blueprint:
  name: 积光整缸 — 风暴（闪电 + 随机大浪） / Whole-tank storm
  description: >-
    天气报雷暴时，循环制造风暴：每一阵 = 放闪电 + 把造浪泵切到浪涌/乱流并拉满打一阵
    大浪（随机时长），然后回落到平缓流一段（随机间隔）；如此反复，天气转好后把泵**切回
    潮汐排程**（填了运行模式选择器时），否则恢复到常态波形和强度。天气来自 HA 天气集成。
    造浪泵(fan)和波形/运行模式选择器都可留空——留空就是"纯闪电"风暴，只有灯闪、不动泵。

    While stormy, loop: fire lightning + surge the pump for a random burst, then
    drop to a calm flow for a random gap. Restores the pump when the storm clears.
    The fan pump and wave-mode select are optional — leave both empty for a
    lightning-only storm.
  domain: automation
  input:
    weather_entity:
      name: 天气实体 / Weather entity
      selector:
        entity:
          filter:
            - domain: weather
    lightning_button:
      name: 闪电按钮 / Lightning button
      selector:
        entity:
          filter:
            - integration: zetlight_led
              domain: button
    pump_fan:
      name: 造浪泵（fan 实体，可留空） / Wave pump (fan, optional)
      description: 留空则只放闪电、不动泵。
      default:
      selector:
        entity:
          filter:
            - domain: fan
    pump_wave_mode:
      name: 泵波形选择器（可留空） / Pump wave-mode select (optional)
      default:
      selector:
        entity:
          filter:
            - integration: gts_wavepump
              domain: select
    pump_run_mode:
      name: 泵运行模式选择器（风暴结束切回潮汐，可留空） / Pump run-mode select (optional)
      description: >-
        切浪形(surge/turbulence)会把泵打成手动，风暴结束后要切回潮汐排程，否则泵会
        一直停在手动、丢了潮汐。有这个选择器就填上；GTS 泵填它的"运行模式"select。
        Setting a wave mode puts the pump in manual; at storm end this is switched
        back so the pump resumes its tidal schedule.
      default:
      selector:
        entity:
          filter:
            - integration: gts_wavepump
              domain: select
    restore_mode:
      name: 风暴结束恢复到的运行模式 / Run mode to restore after the storm
      default: tide
      selector:
        select: { custom_value: true, options: [tide] }
    surge_percentage:
      name: 大浪强度 / Surge intensity
      default: 95
      selector:
        number: { min: 0, max: 100, unit_of_measurement: "%" }
    surge_wave:
      name: 大浪波形 / Surge wave mode
      default: surge
      selector:
        select: { custom_value: true, options: [surge, turbulence, pulse] }
    calm_percentage:
      name: 平缓强度（两阵之间） / Calm intensity (between bursts)
      default: 40
      selector:
        number: { min: 0, max: 100, unit_of_measurement: "%" }
    normal_percentage:
      name: 常态强度（风暴结束恢复） / Normal intensity (restored)
      default: 50
      selector:
        number: { min: 0, max: 100, unit_of_measurement: "%" }
    normal_wave:
      name: 常态波形（恢复用） / Normal wave mode
      default: sine
      selector:
        select: { custom_value: true, options: [constant, pulse, sine, turbulence, surge] }
    burst_min:
      name: 每阵大浪最短（秒） / Burst min (s)
      default: 8
      selector:
        number: { min: 2, max: 120, unit_of_measurement: s }
    burst_max:
      name: 每阵大浪最长（秒） / Burst max (s)
      default: 20
      selector:
        number: { min: 2, max: 120, unit_of_measurement: s }
    gap_min:
      name: 两阵之间最短（秒） / Gap min (s)
      default: 30
      selector:
        number: { min: 3, max: 600, unit_of_measurement: s }
    gap_max:
      name: 两阵之间最长（秒） / Gap max (s)
      default: 90
      selector:
        number: { min: 3, max: 600, unit_of_measurement: s }
    storm_states:
      name: 算作雷暴的天气状态 / Storm weather states
      default: [lightning, lightning-rainy]
      selector:
        select:
          multiple: true
          custom_value: true
          options: [lightning, lightning-rainy, pouring, hail]

mode: restart

variables:
  storm: !input storm_states
  weather: !input weather_entity
  b_lo: !input burst_min
  b_hi: !input burst_max
  g_lo: !input gap_min
  g_hi: !input gap_max
  pump: !input pump_fan
  wave: !input pump_wave_mode
  run_sel: !input pump_run_mode
  restore_md: !input restore_mode
  surge_pct: !input surge_percentage
  calm_pct: !input calm_percentage
  normal_pct: !input normal_percentage
  surge_wv: !input surge_wave
  normal_wv: !input normal_wave

trigger:
  - platform: state
    entity_id: !input weather_entity

condition:
  - "{{ trigger.to_state.state in storm }}"

action:
  - repeat:
      while:
        - "{{ states(weather) in storm }}"
      sequence:
        # one storm burst: lightning + (optionally) a big wave
        - service: button.press
          target:
            entity_id: !input lightning_button
        - if: "{{ wave not in [none, '', []] }}"
          then:
            - service: select.select_option
              target: { entity_id: "{{ wave }}" }
              data: { option: "{{ surge_wv }}" }
        - if: "{{ pump not in [none, '', []] }}"
          then:
            - service: fan.set_percentage
              target: { entity_id: "{{ pump }}" }
              data: { percentage: "{{ surge_pct }}" }
        - delay:
            seconds: "{{ range(b_lo | int, (b_hi | int) + 1) | random }}"
        # calm gap between bursts
        - if: "{{ wave not in [none, '', []] }}"
          then:
            - service: select.select_option
              target: { entity_id: "{{ wave }}" }
              data: { option: "{{ normal_wv }}" }
        - if: "{{ pump not in [none, '', []] }}"
          then:
            - service: fan.set_percentage
              target: { entity_id: "{{ pump }}" }
              data: { percentage: "{{ calm_pct }}" }
        - delay:
            seconds: "{{ range(g_lo | int, (g_hi | int) + 1) | random }}"
  # storm over: hand the pump back to its tidal schedule if a run-mode select is
  # given (setting a wave mode leaves the pump in manual, so this is required to
  # not lose the tidal program); otherwise restore a steady wave + percentage.
  - if: "{{ run_sel not in [none, '', []] }}"
    then:
      - service: select.select_option
        target: { entity_id: "{{ run_sel }}" }
        data: { option: "{{ restore_md }}" }
    else:
      - if: "{{ wave not in [none, '', []] }}"
        then:
          - service: select.select_option
            target: { entity_id: "{{ wave }}" }
            data: { option: "{{ normal_wv }}" }
      - if: "{{ pump not in [none, '', []] }}"
        then:
          - service: fan.set_percentage
            target: { entity_id: "{{ pump }}" }
            data: { percentage: "{{ normal_pct }}" }
