blueprint:
  name: Zetlight whole-tank — storm (lightning + flow surge)
  description: >-
    On stormy weather, fire the light's lightning effect, switch the wave pump to
    a surge/turbulence wave and raise its intensity for a while, then restore the
    normal wave and intensity. Weather comes from a HA weather integration.
  domain: automation
  input:
    weather_entity:
      name: Weather entity
      selector:
        entity:
          filter:
            - domain: weather
    lightning_button:
      name: Light lightning button
      selector:
        entity:
          filter:
            - integration: zetlight_led
              domain: button
    pump_fan:
      name: Wave pump (fan)
      selector:
        entity:
          filter:
            - domain: fan
    pump_wave_mode:
      name: Wave pump wave-mode select
      selector:
        entity:
          filter:
            - integration: gts_wavepump
              domain: select
    surge_percentage:
      name: Surge intensity
      default: 90
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    surge_wave:
      name: Surge wave mode
      default: surge
      selector:
        select:
          custom_value: true
          options: [surge, turbulence, pulse]
    normal_percentage:
      name: Normal intensity (restored)
      default: 50
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    normal_wave:
      name: Normal wave mode (restored)
      default: sine
      selector:
        select:
          custom_value: true
          options: [constant, pulse, sine, turbulence, surge]
    surge_duration:
      name: Surge duration
      default: "00:02:00"
      selector:
        duration:
    storm_states:
      name: Weather states that count as a storm
      default: [lightning, lightning-rainy]
      selector:
        select:
          multiple: true
          custom_value: true
          options: [lightning, lightning-rainy, pouring, hail]

mode: single

variables:
  storm: !input storm_states

trigger:
  - platform: state
    entity_id: !input weather_entity

condition:
  - condition: template
    value_template: "{{ trigger.to_state.state in storm }}"

action:
  - service: button.press
    target:
      entity_id: !input lightning_button
  - service: select.select_option
    target:
      entity_id: !input pump_wave_mode
    data:
      option: !input surge_wave
  - service: fan.set_percentage
    target:
      entity_id: !input pump_fan
    data:
      percentage: !input surge_percentage
  - delay: !input surge_duration
  - service: select.select_option
    target:
      entity_id: !input pump_wave_mode
    data:
      option: !input normal_wave
  - service: fan.set_percentage
    target:
      entity_id: !input pump_fan
    data:
      percentage: !input normal_percentage
