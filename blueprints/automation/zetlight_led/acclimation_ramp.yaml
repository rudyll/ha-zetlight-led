blueprint:
  name: 积光灯 — 驯化渐进 / Acclimation ramp
  description: >-
    新珊瑚驯化：每天在设定时间把"驯化比例"提高一个步长（最高 100%），并重新应用一个
    预设，让设备按新比例运行。先把驯化数字设低（如 40），再让它逐日升到 100。

    Each day, raise the Acclimation % by a step (capped at 100) and re-apply a
    preset, to ease new corals in.
  domain: automation
  input:
    at_time:
      name: 每天时间 / Time of day
      default: "11:00:00"
      selector:
        time:
    acclimation_number:
      name: 驯化比例实体 / Acclimation number entity
      selector:
        entity:
          filter:
            - integration: zetlight_led
              domain: number
    preset_select:
      name: 预设选择器实体 / Preset select entity
      selector:
        entity:
          filter:
            - integration: zetlight_led
              domain: select
    preset_name:
      name: 要重新应用的预设名 / Preset to re-apply
      selector:
        text:
    step:
      name: 每日步长（%） / Daily step (%)
      default: 10
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: "%"

mode: single

variables:
  accl_entity: !input acclimation_number
  day_step: !input step

trigger:
  - platform: time
    at: !input at_time

action:
  - service: number.set_value
    target:
      entity_id: "{{ accl_entity }}"
    data:
      value: "{{ [100, (states(accl_entity) | float(100)) + day_step] | min }}"
  - delay: "00:00:02"
  - service: select.select_option
    target:
      entity_id: !input preset_select
    data:
      option: !input preset_name
