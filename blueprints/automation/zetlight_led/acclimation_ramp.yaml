blueprint:
  name: 积光灯 — 驯化渐进 / Acclimation ramp
  description: >-
    新珊瑚驯化：每天在设定时间把"驯化比例"提高一个步长（最高 100%）。驯化比例会按比例
    缩放你现有日程的输出（保留曲线），到 100% 自动还原为你配置的日程。先把驯化比例手动
    设低（如 40），再让它逐日升到 100。

    Each day, raise the Acclimation % by a step (capped at 100). It scales your
    existing schedule's output and restores it fully at 100%.
  domain: automation
  input:
    at_time:
      name: 每天时间 / Time of day
      default: "11:00:00"
      selector:
        time:
    acclimation_number:
      name: 调光比例实体 / Dimming number entity
      selector:
        entity:
          filter:
            - integration: zetlight_led
              domain: number
    step:
      name: 每日步长（%） / Daily step (%)
      default: 10
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: "%"

mode: single

variables:
  accl_entity: !input acclimation_number
  day_step: !input step

trigger:
  - platform: time
    at: !input at_time

action:
  - service: number.set_value
    target:
      entity_id: "{{ accl_entity }}"
    data:
      value: "{{ [100, (states(accl_entity) | float(100)) + day_step] | min }}"
